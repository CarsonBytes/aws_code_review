name: PR Security Scan Demo

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Scan Demo
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display CloudFormation Security Issue
        run: |
          echo "=========================================="
          echo "🔍 CLOUDFORMATION TEMPLATE SCAN"
          echo "=========================================="
          echo ""
          
          if [ -f "demo2_pr_inspector/template.yaml" ]; then
            echo "✅ Found: demo2_pr_inspector/template.yaml"
            echo ""
            echo "🚨 CRITICAL SECURITY ISSUE DETECTED:"
            echo ""
            echo "File: template.yaml"
            echo "Issue: AdministratorAccess policy"
            echo "Location:"
            grep -n "AdministratorAccess" demo2_pr_inspector/template.yaml
            echo ""
            echo "📋 Problem:"
            echo "- IAM role has full AWS administrative access"
            echo "- Violates least privilege principle"
            echo "- High security risk"
            echo ""
            echo "💡 Recommendation:"
            echo "Replace with specific, limited policies:"
            echo '```yaml'
            echo 'ManagedPolicyArns:'
            echo '  - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess'
            echo '  - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess'
            echo '```'
          else
            echo "❌ No CloudFormation template found"
          fi

      - name: Display Dependency Security Issue
        run: |
          echo ""
          echo "=========================================="
          echo "📦 DEPENDENCY VULNERABILITY SCAN"
          echo "=========================================="
          echo ""
          
          if [ -f "demo2_pr_inspector/requirements.txt" ]; then
            echo "✅ Found: demo2_pr_inspector/requirements.txt"
            echo "Content:"
            cat demo2_pr_inspector/requirements.txt
            echo ""
            echo "⚠️  CVE VULNERABILITIES DETECTED:"
            echo ""
            echo "Package: requests==2.25.1"
            echo "Known CVEs:"
            echo "- CVE-2023-32681: Information disclosure"
            echo "- CVE-2023-32682: Request smuggling"
            echo ""
            echo "📋 Impact:"
            echo "- High security risk"
            echo "- Potential data leakage"
            echo "- Network attack vector"
            echo ""
            echo "💡 Recommendation:"
            echo "Upgrade to secure version:"
            echo "requests>=2.31.0"
          else
            echo "❌ No requirements.txt found"
          fi

      - name: Display Code Quality Issue
        run: |
          echo ""
          echo "=========================================="
          echo "🤖 CODE QUALITY REVIEW"
          echo "=========================================="
          echo ""
          
          if [ -f "demo2_pr_inspector/order_logic.py" ]; then
            echo "✅ Found: demo2_pr_inspector/order_logic.py"
            echo "Content:"
            cat demo2_pr_inspector/order_logic.py
            echo ""
            echo "⚠️  BUSINESS LOGIC ISSUE DETECTED:"
            echo ""
            echo "Function: update_delivery_date(order_id, new_date)"
            echo "Problem: Missing validation logic"
            echo ""
            echo "📋 Issues:"
            echo "1. No check if order exists"
            echo "2. No check if order is already shipped"
            echo "3. Allows modification of shipped orders"
            echo ""
            echo "📈 Impact Assessment:"
            echo "- Business Impact: HIGH"
            echo "- Security Impact: MEDIUM"
            echo "- Data Integrity: COMPROMISED"
            echo ""
            echo "💡 Recommended Fix:"
            echo '```python'
            echo 'def update_delivery_date(order_id, new_date):'
            echo '    # 1. Check if order exists'
            echo '    order = get_order(order_id)'
            echo '    if not order:'
            echo '        return {"error": "Order not found"}'
            echo '    '
            echo '    # 2. Check order status'
            echo '    if order.get("status") == "shipped":'
            echo '        return {"error": "Cannot modify shipped orders"}'
            echo '    '
            echo '    # 3. Update logic'
            echo '    order["delivery_date"] = new_date'
            echo '    save_order(order)'
            echo '    '
            echo '    return {"status": "updated", "new_date": new_date}'
            echo '```'
          else
            echo "❌ No order_logic.py found"
          fi

      - name: Display Summary
        run: |
          echo ""
          echo "=========================================="
          echo "📊 SCAN SUMMARY"
          echo "=========================================="
          echo ""
          echo "🔍 Total Issues Found: 3"
          echo ""
          echo "1. 🚨 CRITICAL: CloudFormation - AdministratorAccess"
          echo "   • IAM role has full AWS access"
          echo "   • Fix: Use least-privilege policies"
          echo ""
          echo "2. ⚠️  HIGH: Dependency - requests==2.25.1 CVEs"
          echo "   • CVE-2023-32681, CVE-2023-32682"
          echo "   • Fix: Upgrade to requests>=2.31.0"
          echo ""
          echo "3. ⚠️  MEDIUM: Code - Missing validation"
          echo "   • No order status check"
          echo "   • Fix: Add validation logic"
          echo ""
          echo "✅ Demo Complete: PR-triggered security scan working"
          echo ""
          echo "💡 This simulates:"
          echo "- Amazon Inspector: Infrastructure & dependency scanning"
          echo "- Amazon Q Developer: Code quality review"
          echo "- Automated PR feedback"