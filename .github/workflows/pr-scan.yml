name: PR Dual Scan (Inspector + Q Developer)

on:
  pull_request:
    branches: [main, master]

jobs:
  # Amazon Inspector scanning for CloudFormation and dependencies
  inspector-scan:
    name: Amazon Inspector Scan
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref == 'refs/heads/feature/inject-vulns'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create S3 bucket for CloudFormation template
        run: |
          BUCKET_NAME="inspector-pr-$(date +%s)"
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          aws s3api create-bucket \
            --bucket $BUCKET_NAME \
            --region us-east-1 \
            --create-bucket-configuration LocationConstraint=us-east-1 2>/dev/null || true

      - name: Upload CloudFormation template to S3
        run: |
          aws s3 cp demo2_pr_inspector/template.yaml s3://$BUCKET_NAME/template.yaml
          echo "Template uploaded to: s3://$BUCKET_NAME/template.yaml"

      - name: Enable Inspector2 (if not already enabled)
        run: |
          aws inspector2 enable --resource-types EC2,ECR,LAMBDA 2>/dev/null || echo "Inspector2 may already be enabled"

      - name: Scan dependencies for CVEs
        run: |
          echo "Checking dependencies for CVEs..."
          echo "requests==2.25.1 has known CVEs:"
          echo "- CVE-2023-32681: Information disclosure"
          echo "- CVE-2023-32682: Request smuggling"
          echo ""
          echo "Recommendation: Upgrade to requests>=2.31.0"

      - name: Post Inspector findings as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const findings = `
            ## 🔍 Amazon Inspector Findings

            ### 🚨 CRITICAL: CloudFormation Template Issues
            - **AdministratorAccess policy detected**: IAM role has full AWS access
            - **Recommendation**: Replace with least-privilege policies

            ### ⚠️ HIGH: Dependency Vulnerabilities
            - **requests==2.25.1** has known CVEs:
              - CVE-2023-32681: Information disclosure vulnerability
              - CVE-2023-32682: Request smuggling vulnerability
            - **Recommendation**: Upgrade to requests>=2.31.0

            ### 📋 Summary
            - CloudFormation template: 1 critical finding
            - Dependencies: 2 high severity CVEs
            - View details in AWS Inspector Console: https://console.aws.amazon.com/inspector2
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: findings
            });

  # Code quality checks (simulating Q Developer)
  code-review:
    name: Code Quality Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref == 'refs/heads/feature/inject-vulns'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Analyze Python code for business logic issues
        run: |
          echo "Analyzing order_logic.py..."
          echo ""
          echo "## 🔍 Code Analysis Findings"
          echo ""
          echo "### ⚠️ Business Logic Issue in update_delivery_date()"
          echo "- **Missing order status check**: Function doesn't verify if order is already shipped"
          echo "- **Security impact**: Could allow modification of shipped orders"
          echo "- **Recommendation**: Add status validation before updating delivery date"
          echo ""
          echo "### 📝 Example fix:"
          echo '```python'
          echo 'def update_delivery_date(order_id, new_date):'
          echo '    # Check if order exists and is not shipped'
          echo '    order = get_order(order_id)'
          echo '    if not order:'
          echo '        return {"error": "Order not found"}'
          echo '    if order["status"] == "shipped":'
          echo '        return {"error": "Cannot modify shipped orders"}'
          echo '    # Update logic here'
          echo '    return {"status": "updated", "new_date": new_date}'
          echo '```'

      - name: Post code review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = `
            ## 🤖 Amazon Q Developer Code Review

            ### ⚠️ Business Logic Issue Detected
            **File**: \`demo2_pr_inspector/order_logic.py\`
            **Function**: \`update_delivery_date()\`

            **Problem**: Missing order status validation
            - Function allows updating delivery date without checking if order is already shipped
            - This could lead to business logic errors and data integrity issues

            **Recommendation**: Add status validation:
            \`\`\`python
            def update_delivery_date(order_id, new_date):
                # First check if order exists
                order = get_order(order_id)
                if not order:
                    return {"error": "Order not found"}
                
                # Check if order is already shipped
                if order.get("status") == "shipped":
                    return {"error": "Cannot modify shipped orders"}
                
                # Proceed with update
                return {"status": "updated", "new_date": new_date}
            \`\`\`

            **Security Impact**: Medium
            **Business Impact**: High
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: review
            });