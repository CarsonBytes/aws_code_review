name: AWS Inspector CloudFormation Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  inspector-scan:
    name: AWS Inspector CloudFormation Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Scan CloudFormation Template
        run: |
          aws inspector2 scan-cfn-template \
            --template-body file://demo2_pr_inspector/template.yaml \
            --region us-east-1

      - name: View Findings in AWS Console
        run: |
          echo "Scan completed. Findings will appear in AWS Inspector Console."
          echo "View findings at: https://console.aws.amazon.com/inspector2"